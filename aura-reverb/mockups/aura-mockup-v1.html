:root {
  /* PLUGIN-SPECIFIC: Aura's accent pair - gold, at H=39 (2026-09-02, third iteration - #6D85E6
     collided with nothing but was replaced anyway, #62BA88 landed 18deg from Strike's green,
     #56B399 landed 7deg from Caverns' teal, #DC9952 landed 10deg from Gradient's orange - H=39
     sits in the actual open gap between Gradient's orange (H21) and Corrosion's yellow-olive
     (H57), ~18deg clear of each). That colour IS accentBrightHi verbatim - checked against every
     other plugin's own titleLabel.setColour() call in PluginEditor.cpp, the wordmark literal
     equals accentBrightHi exactly in every plugin except Caverns (the oldest, a historical
     exception, not the rule) - so no separate derivation needed there. accentMuted/
     accentBrightLo/badgeInk are new variations at the same H=39, matching the catalog's usual
     S/L shape (muted: S~32,L~46 / brightHi: S~66,L~59 (given) / brightLo: S~75,L~45). */
  --accent-muted: #9B8150;
  --accent-bright-hi: #DCAC52;
  --accent-bright-lo: #C98D1D;
  --badge-ink: #251D0E;

  /* Fixed tokens - same across every plugin using this visual language. */
  --tick: #818f8c;
  --knob-fill: #16191a;
  --pointer: #c7c0ac;
  --btn-off: #cec8b7;
  --btn-on: #dcd6c4;
  --led-off: #8a8578;
  --led-on: #e4463c;
  --panel-border: rgba(230,236,230,0.62);
  --ink: #cfe3e0;
  --ink-dim: #8fa19e;
  --fader-track-top: #14191a;
  --fader-track-bottom: #1c2224;

  --tagline-colour: #6f8280;
  --footer-left-colour: #586566;
  --footer-right-colour: #3a4547;
}

* { box-sizing: border-box; }
body { margin:0; background:#000; display:flex; align-items:center; justify-content:center; padding:40px; font-family:'Oswald',sans-serif; }

.chassis {
  /* fit-content (not a fixed px) so the whole plugin window shrinks to match the now content-
     sized sections (see .hw-section's comment) instead of leaving them stranded in dead space
     inside an arbitrarily wide fixed chassis - the header/footer/body-row chain below all use
     ordinary block width:auto, so they resolve to this same shrink-to-fit width consistently. */
  width: fit-content; border-radius: 18px; position: relative; padding: 15px;
  background: linear-gradient(160deg, #1c1f20 0%, #0a0c0d 100%);
  box-shadow: 0 24px 60px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,255,255,0.07);
}
.chassis::before {
  content:''; position:absolute; inset:0; border-radius:18px; z-index:0;
  background: radial-gradient(circle at 18% 12%, rgba(255,255,255,0.10), transparent 45%);
  pointer-events:none;
}
.chassis::after {
  content:''; position:absolute; inset:0; border-radius:18px; pointer-events:none; z-index:0;
  background:
    repeating-linear-gradient(35deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px),
    repeating-linear-gradient(-35deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 3px);
}

.panel {
  position:relative; border-radius:8px; z-index:1;
  background: linear-gradient(165deg, #262d2f 0%, #1d2325 55%, #171c1d 100%);
  box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 0 0 1.5px rgba(0,0,0,0.65), 0 1px 3px rgba(0,0,0,0.5);
  display:flex; flex-direction:column; overflow:hidden;
}
.panel::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(circle at 15% 8%, rgba(255,255,255,0.10), transparent 40%);
}

.header {
  height:64px; flex:0 0 auto; position:relative; z-index:1;
  background: linear-gradient(180deg, #14181a 0%, #0d1011 100%);
  border-bottom: 1px solid #33393b;
  display:flex; align-items:center; justify-content:space-between; padding:0 22px;
}
.brand { display:flex; align-items:baseline; gap:11px; }
.wordmark { font-family:'Oxanium',sans-serif; font-weight:700; font-size:27px; letter-spacing:0.035em; color:var(--accent-bright-hi); }
.tagline { font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.26em; text-transform:uppercase; color:var(--tagline-colour); }

.hw-toggle {
  display:flex; align-items:center; gap:9px; height:28px; padding:0 15px; border-radius:3px;
  background:var(--btn-off); cursor:pointer; user-select:none;
  box-shadow: 0 3px 6px rgba(0,0,0,0.45);
  font-family:'Oxanium',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.06em; color:#242220;
}
.hw-toggle.on { background:var(--btn-on); }
.led { width:9px; height:9px; border-radius:50%; background:var(--led-off); display:inline-block; }
.led.on { background:var(--led-on); box-shadow:0 0 8px 3px rgba(228,70,60,0.8); }

/* Sections are content-sized (flex:0 0 auto), NOT proportionally flex-grown like the rest of the
   catalog's sections - a flex-grow ratio always fills 100% of the row regardless of how small the
   ratio is relative to its siblings (only the RELATIVE proportion changes, never the total), so
   shrinking a ratio can't actually remove dead space around content - confirmed by rendering
   before writing this comment, not assumed. justify-content:center + a wider gap is what
   distributes the row's leftover width instead, as visible space BETWEEN sections rather than
   inside them. */
.body-row { display:flex; gap:26px; padding:18px 18px 0 18px; position:relative; z-index:1; }

.hw-section {
  position:relative; border:3.5px solid var(--panel-border); border-radius:7px;
  padding:40px 10px 20px; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-start; gap:16px; flex:0 0 auto;
}

.section-badge {
  position:absolute; top:9px; left:50%; transform:translateX(-50%);
  background:var(--accent-muted); color:var(--badge-ink); padding:5px 18px 4px;
  font-family:'Oxanium',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  border-radius:3px; white-space:nowrap;
}

.knob-row { display:flex; gap:26px; justify-content:center; align-items:flex-start; width:100%; }
.knob-cell { display:flex; flex-direction:column; align-items:center; gap:3px; }
.knob-svg { display:block; }
.knob-name { font-family:'Oxanium',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink); white-space:nowrap; }

/* Converter: a button + 3-row LED list (8/16/24 bit), replacing the old Bit Depth knob - matches
   flux-phaser's own Stages Shift-button/LED-list pattern in spirit, stacked (button above list)
   rather than side-by-side since this occupies a single knob-row rather than a dedicated section. */
.converter-cell { display:flex; flex-direction:column; align-items:center; gap:10px; }
.converter-button {
  height:22px; padding:0 12px; border-radius:3px; background:var(--btn-off);
  box-shadow: 0 3px 6px rgba(0,0,0,0.45); cursor:pointer; user-select:none;
  font-family:'Oxanium',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.06em; color:#242220;
  display:flex; align-items:center; justify-content:center; white-space:nowrap;
}
.converter-leds { display:flex; flex-direction:column; gap:5px; }
.converter-led-row { display:flex; align-items:center; gap:7px; }
.converter-led-row .knob-name { font-size:10px; opacity:0.6; }
.converter-led-row.on .knob-name { opacity:1; }
.knob-value { font-family:'Oxanium',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:0.03em; color:var(--ink-dim); }

/* flex:1 chain (row -> cell -> track-wrap) so the faders fill the section's full available
   height rather than stopping at a fixed px value - min-height:0 at each column-direction link
   is required, not optional (see the hardware-panel-ui skill's flexbox min-height:auto gotcha) -
   without it .fader-cell's/track-wrap's CONTENT-driven natural height silently overrides flex:1's
   shrink/grow and the track stops short again. */
.fader-row { display:flex; gap:14px; justify-content:center; align-items:stretch; width:100%; flex:1; min-height:0; }
.fader-cell { display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; min-height:0; }
.fader-name { font-family:'Oxanium',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink); white-space:nowrap; }
.fader-value { font-family:'Oxanium',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:0.03em; color:var(--ink-dim); }
.fader-track-wrap { position:relative; width:24px; flex:1; min-height:0; }

.footer { height:30px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:0 18px; background:transparent;
  font-family:'Oswald',sans-serif; font-weight:600; font-size:9.5px; letter-spacing:0.14em; }
.footer .left { color:var(--footer-left-colour); }
.footer .right { color:var(--footer-right-colour); }
</style>
</head>
<body>
<div class="chassis">
  <div class="panel">
    <div class="header">
      <div class="brand">
        <div class="wordmark">AURA</div>
        <div class="tagline">Ambience Reverb</div>
      </div>
      <div class="hw-toggle" id="bypassToggle"><span class="led" id="bypassLed"></span><span>BYPASS</span></div>
    </div>

    <div class="body-row">
      <div class="hw-section tone">
        <div class="section-badge">Tone</div>
        <div class="knob-row">
          <div class="knob-cell" id="k-lowcut"></div>
          <div class="knob-cell" id="k-color"></div>
        </div>
        <div class="knob-row">
          <div class="converter-cell" id="c-converter"></div>
        </div>
      </div>

      <div class="hw-section timing">
        <div class="section-badge">Timing</div>
        <div class="knob-row">
          <div class="knob-cell" id="k-predelay"></div>
        </div>
        <div class="knob-row">
          <div class="knob-cell" id="k-decay"></div>
        </div>
      </div>

      <div class="hw-section mix">
        <div class="section-badge">Mix</div>
        <div class="fader-row">
          <div class="fader-cell" id="f-wet"></div>
          <div class="fader-cell" id="f-dry"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="left">AURA &middot; v0.1.0</div>
      <div class="right">WILD JAG</div>
    </div>
  </div>
</div>

<script>
function knobSVG(size, value) {
  const cx = size / 2, cy = size / 2;
  const startDeg = -135, endDeg = 135;
  const toXY = (r, deg) => {
    const rad = deg * Math.PI / 180;
    return [cx + r * Math.sin(rad), cy - r * Math.cos(rad)];
  };

  const radius = size / 2 - 4;
  const capRadius = radius * 0.72;
  const tickInnerRadius = radius * 0.84;
  const tickOuterRadius = radius * 0.98;
  const insetRadius = capRadius - 5.5;

  let ticks = '';
  for (let i = 0; i <= 10; i++) {
    const deg = startDeg + (i / 10) * (endDeg - startDeg);
    const major = (i === 0 || i === 5 || i === 10);
    const [x1, y1] = toXY(tickInnerRadius, deg), [x2, y2] = toXY(tickOuterRadius, deg);
    ticks += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="var(--tick)" stroke-width="${major ? 2.2 : 1.5}" stroke-opacity="${major ? 0.85 : 0.55}" stroke-linecap="round"/>`;
  }

  let flutes = '';
  const numFlutes = 26;
  for (let i = 0; i < numFlutes; i++) {
    const deg = (360 / numFlutes) * i;
    const [x1, y1] = toXY(capRadius - 3.0, deg), [x2, y2] = toXY(capRadius, deg);
    flutes += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="rgba(0,0,0,0.4)" stroke-width="1.0"/>`;
  }

  const pointerDeg = startDeg + value * (endDeg - startDeg);
  const [px1, py1] = toXY(capRadius * 0.32, pointerDeg);
  const [px2, py2] = toXY(capRadius - 5.0, pointerDeg);
  const pointer = `<line x1="${px1.toFixed(2)}" y1="${py1.toFixed(2)}" x2="${px2.toFixed(2)}" y2="${py2.toFixed(2)}" stroke="var(--pointer)" stroke-opacity="0.88" stroke-width="2.6" stroke-linecap="butt"/>`;

  return `<svg class="knob-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${ticks}
    <circle cx="${cx}" cy="${cy}" r="${capRadius.toFixed(2)}" fill="var(--knob-fill)"/>
    <circle cx="${cx}" cy="${cy}" r="${capRadius.toFixed(2)}" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="${(capRadius - 0.75).toFixed(2)}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    ${flutes}
    <circle cx="${cx}" cy="${cy}" r="${insetRadius.toFixed(2)}" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
    ${pointer}
  </svg>`;
}

function makeKnob(id, size, value, name, valueText) {
  const el = document.getElementById(id);
  el.innerHTML = knobSVG(size, value) + `<div class="knob-name">${name}</div><div class="knob-value">${valueText}</div>`;
}

// selectedIndex: which of choices[] is lit (0/1/2 for 8/16/24 bit) - matches the real button's
// cycling behaviour (click -> next choice, wrapping), just static here since the mockup has no
// interaction.
function makeConverter(id, choices, selectedIndex) {
  const el = document.getElementById(id);
  const rows = choices.map((label, i) => {
    const on = i === selectedIndex ? ' on' : '';
    return `<div class="converter-led-row${on}"><span class="led${on}"></span><div class="knob-name">${label}</div></div>`;
  }).join('');
  el.innerHTML = `<div class="converter-button">CONVERTER</div><div class="converter-leds">${rows}</div>`;
}

function faderSVG(trackHeight, value) {
  const trackWidth = 12;
  const cx = 12;
  const fillTop = trackHeight * (1 - value);
  const thumbH = 11;
  const thumbY = Math.max(0, Math.min(trackHeight - thumbH, fillTop - thumbH / 2));

  let svg = `<svg width="24" height="${trackHeight}" viewBox="0 0 24 ${trackHeight}">`;
  svg += `<defs>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--fader-track-top)"/>
      <stop offset="100%" stop-color="var(--fader-track-bottom)"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent-bright-hi)"/>
      <stop offset="100%" stop-color="var(--accent-bright-lo)"/>
    </linearGradient>
  </defs>`;
  svg += `<rect x="${cx - trackWidth/2}" y="0" width="${trackWidth}" height="${trackHeight}" rx="${trackWidth/2}" fill="url(#trackGrad)" stroke="rgba(230,236,230,0.3)" stroke-width="1"/>`;
  if (value > 0) {
    svg += `<rect x="${cx - trackWidth/2}" y="${fillTop}" width="${trackWidth}" height="${trackHeight - fillTop}" rx="${trackWidth/2}" fill="var(--accent-bright-hi)" opacity="0.35" filter="blur(5px)"/>`;
    svg += `<rect x="${cx - trackWidth/2}" y="${fillTop}" width="${trackWidth}" height="${trackHeight - fillTop}" rx="${trackWidth/2}" fill="url(#fillGrad)"/>`;
  }
  svg += `<rect x="1" y="${thumbY}" width="22" height="${thumbH}" rx="1" fill="#0f1213" stroke="rgba(0,0,0,0.55)" stroke-width="1"/>`;
  svg += `</svg>`;
  return svg;
}

// Two-pass: insert an EMPTY track-wrap first so the browser's flexbox layout gives it its real
// height (flex:1 up through fader-row/fader-cell - see the CSS comment above .fader-row), THEN
// measure that actual pixel height and draw the SVG at it. A fixed guessed height would only
// match whatever TONE/TIMING happen to measure at right now and silently go stale the next time
// either section's content changes - measuring is what makes "full height of the section" true
// regardless of future edits.
function makeFader(id, value, name, valueText) {
  const el = document.getElementById(id);
  el.innerHTML = `<div class="fader-name">${name}</div>` +
    `<div class="fader-track-wrap"></div>` +
    `<div class="fader-value">${valueText}</div>`;
  const wrap = el.querySelector('.fader-track-wrap');
  const trackHeight = wrap.clientHeight;
  wrap.innerHTML = faderSVG(trackHeight, value);
}

makeKnob('k-lowcut', 88, 0.0, 'Low Cut', 'Off');
makeKnob('k-color', 88, 1.0, 'Color', '0.0 dB');
makeConverter('c-converter', ['8 bit', '16 bit', '24 bit'], 0);
makeKnob('k-predelay', 88, 0.0, 'Pre-Delay', '0.0 ms');
makeKnob('k-decay', 112, 0.45, 'Decay', '2.00 s');
makeFader('f-wet', 0.25, 'Wet', '50.0%');
makeFader('f-dry', 1.0, 'Dry', '100.0%');
</script>
</body>
</html>
